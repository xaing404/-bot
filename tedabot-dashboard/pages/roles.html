/* ============================================================
   TedaBot Dashboard — "Anodized Deep" Color & Type System
   Inspired by Linear / Raycast dark dashboard aesthetics
   Single brand hue: Indigo #5e6ad2
   ============================================================ */

/* ---- Design Tokens (Dark = Default) ---- */
:root {
  /* Surface ladder — 4-step dark gradient */
  --tb-canvas: #08090a;
  --tb-surface: #0d0d0f;
  --tb-surface-elevated: #121214;
  --tb-surface-card: #161619;

  /* Hairlines */
  --tb-hairline: #24272b;
  --tb-hairline-soft: rgba(255, 255, 255, 0.06);
  --tb-hairline-strong: rgba(255, 255, 255, 0.10);

  /* Text */
  --tb-ink: #f4f4f6;
  --tb-body: #cdced4;
  --tb-mute: #8a8f98;
  --tb-ash: #5c6166;

  /* Brand — single hue: Indigo */
  --tb-primary: #5e6ad2;
  --tb-primary-hover: #6d7ade;
  --tb-primary-deep: #4c54b8;
  --tb-primary-glow: rgba(94, 106, 210, 0.12);
  --tb-primary-soft: rgba(94, 106, 210, 0.18);
  --tb-primary-foreground: #ffffff;

  /* State colors — semantic only */
  --tb-success: #59d499;
  --tb-success-soft: rgba(89, 212, 153, 0.12);
  --tb-warning: #ffc533;
  --tb-warning-soft: rgba(255, 197, 51, 0.12);
  --tb-error: #ff6161;
  --tb-error-soft: rgba(255, 97, 97, 0.12);
  --tb-info: #57c1ff;
  --tb-info-soft: rgba(87, 193, 255, 0.12);

  /* Radius scale */
  --tb-radius-small: 4px;
  --tb-radius-medium: 8px;
  --tb-radius-large: 16px;
  --tb-radius-full: 9999px;

  /* Shadows — floating layers only */
  --tb-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.24), 0 1px 1px rgba(0, 0, 0, 0.12);
  --tb-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.48);
  --tb-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.64);

  /* ---- Semantic Aliases (required by head contract) ---- */
  --tb-background: var(--tb-canvas);
  --tb-foreground: var(--tb-ink);
  --tb-card: var(--tb-surface);
  --tb-card-foreground: var(--tb-ink);
  --tb-popover: var(--tb-surface-elevated);
  --tb-popover-foreground: var(--tb-ink);
  --tb-muted: var(--tb-surface-elevated);
  --tb-muted-foreground: var(--tb-mute);
  --tb-border: var(--tb-hairline);
  --tb-input: var(--tb-hairline);
  --tb-ring: #5e6ad2;

  /* Typography */
  --tb-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --tb-font-mono: "JetBrains Mono", "Geist Mono", "Berkeley Mono", ui-monospace, monospace;

  /* ---- Raw token mirrors for @theme inline ---- */
  --color-background: #08090a;
  --color-foreground: #f4f4f6;
  --color-card: #0d0d0f;
  --color-card-foreground: #f4f4f6;
  --color-popover: #121214;
  --color-popover-foreground: #f4f4f6;
  --color-primary: #5e6ad2;
  --color-primary-foreground: #ffffff;
  --color-muted: #121214;
  --color-muted-foreground: #8a8f98;
  --color-border: #24272b;
  --color-input: #24272b;
  --color-ring: #5e6ad2;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;
}

/* ---- Light mode (optional, not primary) ---- */
.light {
  --tb-canvas: #fafafa;
  --tb-surface: #ffffff;
  --tb-surface-elevated: #f4f4f5;
  --tb-surface-card: #ebebed;
  --tb-hairline: #e4e4e7;
  --tb-hairline-soft: rgba(0, 0, 0, 0.04);
  --tb-hairline-strong: rgba(0, 0, 0, 0.08);
  --tb-ink: #18181b;
  --tb-body: #3f3f46;
  --tb-mute: #71717a;
  --tb-ash: #a1a1aa;
  --tb-primary: #5e6ad2;
  --tb-primary-hover: #4c54b8;
  --tb-primary-deep: #3d44a0;
  --tb-primary-glow: rgba(94, 106, 210, 0.08);
  --tb-primary-soft: rgba(94, 106, 210, 0.10);
  --tb-background: var(--tb-canvas);
  --tb-foreground: var(--tb-ink);
  --tb-card: var(--tb-surface);
  --tb-card-foreground: var(--tb-ink);
  --tb-popover: var(--tb-surface);
  --tb-popover-foreground: var(--tb-ink);
  --tb-muted: var(--tb-surface-elevated);
  --tb-muted-foreground: var(--tb-mute);
  --tb-border: var(--tb-hairline);
  --tb-input: var(--tb-hairline);
  --tb-ring: #5e6ad2;
  --color-background: #fafafa;
  --color-foreground: #18181b;
  --color-card: #ffffff;
  --color-card-foreground: #18181b;
  --color-popover: #ffffff;
  --color-popover-foreground: #18181b;
  --color-muted: #f4f4f5;
  --color-muted-foreground: #71717a;
  --color-border: #e4e4e7;
  --color-input: #e4e4e7;
}

/* ---- Typography Classes ---- */
.font-sans { font-family: var(--tb-font-sans); }
.font-mono { font-family: var(--tb-font-mono); }

.tabular-nums {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
}

/* Inter distinctive rendering */
body {
  font-family: var(--tb-font-sans);
  font-feature-settings: "ss03", "cv01", "cv03", "cv04", "tnum";
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.01em;
}

/* Heading tightening */
h1, h2, h3, h4, h5, h6 {
  letter-spacing: -0.02em;
  text-wrap: balance;
}

/* Code / data blocks */
code, pre, .mono {
  font-family: var(--tb-font-mono);
  font-feature-settings: "tnum";
}

<style id="critical-layout">
  /* ---- Reset ---- */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ---- App Shell Grid ---- */
  .app-shell {
    display: grid;
    grid-template-columns: 240px 1fr;
    grid-template-rows: 56px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* ---- Sidebar ---- */
  .sidebar {
    grid-column: 1;
    grid-row: 1 / -1;
    display: flex;
    flex-direction: column;
    background: var(--tb-surface);
    border-right: 1px solid var(--tb-hairline);
  }

  .sidebar-header {
    height: 56px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-bottom: 1px solid var(--tb-hairline);
    flex-shrink: 0;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-mark {
    width: 24px;
    height: 24px;
    border-radius: var(--tb-radius-small);
    background: var(--tb-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .logo-text {
    font-size: 14px;
    font-weight: 600;
    color: var(--tb-ink);
    letter-spacing: -0.01em;
  }

  .sidebar-nav {
    flex: 1;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 10px;
    border-radius: var(--tb-radius-medium);
    font-size: 13px;
    font-weight: 500;
    color: var(--tb-mute);
    text-decoration: none;
    transition: background 120ms ease, color 120ms ease;
    position: relative;
  }

  .nav-item svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .nav-item:hover {
    background: var(--tb-surface-elevated);
    color: var(--tb-body);
  }

  .nav-item.active {
    background: var(--tb-surface-elevated);
    color: var(--tb-ink);
  }

  .nav-item.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 2px;
    height: 16px;
    background: var(--tb-primary);
    border-radius: 0 2px 2px 0;
  }

  .sidebar-footer {
    padding: 12px;
    border-top: 1px solid var(--tb-hairline);
    flex-shrink: 0;
  }

  .bot-status {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .bot-status-header {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .bot-status-dot {
    width: 8px;
    height: 8px;
    border-radius: var(--tb-radius-full);
    background: var(--tb-success);
    box-shadow: 0 0 8px rgba(89, 212, 153, 0.4);
  }

  .bot-status-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--tb-ink);
  }

  .bot-status-meta {
    font-size: 11px;
    color: var(--tb-mute);
    padding-left: 16px;
  }

  /* ---- Topbar ---- */
  .topbar {
    grid-column: 2;
    grid-row: 1;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 24px;
    background: var(--tb-surface);
    border-bottom: 1px solid var(--tb-hairline);
  }

  .page-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--tb-ink);
    letter-spacing: -0.01em;
    white-space: nowrap;
  }

  .topbar-search {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--tb-surface-elevated);
    border: 1px solid var(--tb-hairline);
    border-radius: var(--tb-radius-medium);
    padding: 0 10px;
    height: 32px;
    width: 240px;
  }

  .topbar-search svg {
    width: 14px;
    height: 14px;
    color: var(--tb-mute);
    flex-shrink: 0;
  }

  .topbar-search input {
    background: none;
    border: none;
    outline: none;
    font-size: 12px;
    color: var(--tb-body);
    width: 100%;
    font-family: var(--tb-font-sans);
  }

  .topbar-search input::placeholder {
    color: var(--tb-mute);
  }

  .status-pills {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: var(--tb-surface-elevated);
    border: 1px solid var(--tb-hairline);
    border-radius: var(--tb-radius-full);
    font-size: 11px;
    color: var(--tb-mute);
    white-space: nowrap;
  }

  .status-pill-dot {
    width: 6px;
    height: 6px;
    border-radius: var(--tb-radius-full);
  }

  .avatar {
    margin-left: 4px;
    flex-shrink: 0;
  }

  .avatar-circle {
    width: 28px;
    height: 28px;
    border-radius: var(--tb-radius-full);
    background: var(--tb-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
  }

  /* ---- Main ---- */
  .main {
    grid-column: 2;
    grid-row: 2;
    padding: 24px;
    background: var(--tb-canvas);
    overflow-y: auto;
  }

  /* ---- Page Header ---- */
  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .page-header-left h2 {
    font-size: 20px;
    font-weight: 600;
    color: var(--tb-ink);
    line-height: 1.3;
  }

  .page-header-left .subtitle {
    font-size: 13px;
    color: var(--tb-mute);
    margin-top: 2px;
  }

  /* ---- Primary Button ---- */
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 16px;
    background: var(--tb-primary);
    color: #fff;
    border: none;
    border-radius: var(--tb-radius-medium);
    font-size: 13px;
    font-weight: 600;
    font-family: var(--tb-font-sans);
    cursor: pointer;
    transition: background 120ms ease;
    white-space: nowrap;
  }

  .btn-primary:hover {
    background: var(--tb-primary-hover);
  }

  .btn-primary svg {
    width: 16px;
    height: 16px;
  }

  /* ---- Role Card Grid ---- */
  .role-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    align-items: stretch;
  }

  /* ---- Role Card ---- */
  .role-card {
    display: flex;
    flex-direction: column;
    background: var(--tb-surface);
    border: 1px solid var(--tb-hairline);
    border-radius: var(--tb-radius-medium);
    padding: 20px;
    transition: background 120ms ease;
  }

  .role-card:hover {
    background: var(--tb-surface-elevated);
  }

  .role-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .role-card-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--tb-ink);
  }

  .badge-default {
    background: var(--tb-primary-glow);
    color: var(--tb-primary);
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: var(--tb-radius-full);
    white-space: nowrap;
  }

  .badge-source {
    display: inline-block;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: var(--tb-radius-small);
    background: var(--tb-surface-card);
    color: var(--tb-mute);
    white-space: nowrap;
    width: fit-content;
  }

  .badge-source.info {
    color: var(--tb-info);
  }

  .prompt-preview {
    font-size: 13px;
    color: var(--tb-body);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 8px;
  }

  .role-card-footer {
    margin-top: auto;
    padding-top: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .text-btn {
    font-size: 12px;
    font-weight: 500;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    font-family: var(--tb-font-sans);
    transition: opacity 120ms ease;
  }

  .text-btn:hover {
    opacity: 0.8;
  }

  .text-btn.primary {
    color: var(--tb-primary);
  }

  .text-btn.muted {
    color: var(--tb-mute);
  }

  .text-btn.muted:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .text-btn.error {
    color: var(--tb-error);
  }
</style>
